[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-doctor"
version = "0.1.0"
authors = [
  { name="Geonwoo No", email="rjsdnshxmqnr@gmail.com" },
]
description = "On-Device Speculative Decoding Roofline & Hardware Diagnostic Engine"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
]
dependencies = []

[project.scripts]
spec-doctor = "spec_doctor.cli:main"
